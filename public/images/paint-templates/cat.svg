<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Head -->
  <circle cx="100" cy="60" r="35" fill="none" stroke="#999999" stroke-width="2"/>
  <!-- Ears -->
  <ellipse cx="75" cy="35" rx="12" ry="20" fill="none" stroke="#999999" stroke-width="2"/>
  <ellipse cx="125" cy="35" rx="12" ry="20" fill="none" stroke="#999999" stroke-width="2"/>
  <!-- Inner ears -->
  <ellipse cx="75" cy="40" rx="6" ry="12" fill="none" stroke="#999999" stroke-width="1"/>
  <ellipse cx="125" cy="40" rx="6" ry="12" fill="none" stroke="#999999" stroke-width="1"/>
  <!-- Eyes -->
  <circle cx="85" cy="55" r="4" fill="none" stroke="#999999" stroke-width="2"/>
  <circle cx="115" cy="55" r="4" fill="none" stroke="#999999" stroke-width="2"/>
  <!-- Pupils -->
  <circle cx="86" cy="55" r="1.5" fill="#999999"/>
  <circle cx="116" cy="55" r="1.5" fill="#999999"/>
  <!-- Nose -->
  <polygon points="100,65 98,72 102,72" fill="none" stroke="#999999" stroke-width="1"/>
  <!-- Mouth -->
  <path d="M 100 72 Q 90 80 80 75" fill="none" stroke="#999999" stroke-width="2"/>
  <path d="M 100 72 Q 110 80 120 75" fill="none" stroke="#999999" stroke-width="2"/>
  <!-- Body -->
  <ellipse cx="100" cy="140" rx="28" ry="35" fill="none" stroke="#999999" stroke-width="2"/>
  <!-- Tail -->
  <path d="M 75 150 Q 50 145 45 170" fill="none" stroke="#999999" stroke-width="2"/>
  <!-- Front paws -->
  <line x1="90" y1="170" x2="90" y2="200" stroke="#999999" stroke-width="2"/>
  <line x1="110" y1="170" x2="110" y2="200" stroke="#999999" stroke-width="2"/>
</svg>