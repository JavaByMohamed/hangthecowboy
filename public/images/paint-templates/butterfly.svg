<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Butterfly body -->
  <ellipse cx="100" cy="120" rx="6" ry="50" fill="none" stroke="#999999" stroke-width="2"/>
  <!-- Left upper wing -->
  <ellipse cx="70" cy="90" rx="30" ry="40" fill="none" stroke="#999999" stroke-width="2"/>
  <!-- Left lower wing -->
  <ellipse cx="65" cy="150" rx="22" ry="35" fill="none" stroke="#999999" stroke-width="2"/>
  <!-- Right upper wing -->
  <ellipse cx="130" cy="90" rx="30" ry="40" fill="none" stroke="#999999" stroke-width="2"/>
  <!-- Right lower wing -->
  <ellipse cx="135" cy="150" rx="22" ry="35" fill="none" stroke="#999999" stroke-width="2"/>
  <!-- Head -->
  <circle cx="100" cy="60" r="7" fill="none" stroke="#999999" stroke-width="2"/>
  <!-- Left antenna -->
  <path d="M 95 53 Q 85 45 82 35" fill="none" stroke="#999999" stroke-width="2"/>
  <!-- Right antenna -->
  <path d="M 105 53 Q 115 45 118 35" fill="none" stroke="#999999" stroke-width="2"/>
</svg>