<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Stem -->
  <line x1="100" y1="120" x2="100" y2="220" stroke="#999999" stroke-width="2"/>
  <!-- Center flower head -->
  <circle cx="100" cy="90" r="15" fill="none" stroke="#999999" stroke-width="2"/>
  <!-- Petals -->
  <ellipse cx="100" cy="45" rx="12" ry="22" fill="none" stroke="#999999" stroke-width="2"/>
  <ellipse cx="145" cy="65" rx="22" ry="12" fill="none" stroke="#999999" stroke-width="2"/>
  <ellipse cx="145" cy="115" rx="22" ry="12" fill="none" stroke="#999999" stroke-width="2"/>
  <ellipse cx="100" cy="135" rx="12" ry="22" fill="none" stroke="#999999" stroke-width="2"/>
  <ellipse cx="55" cy="115" rx="22" ry="12" fill="none" stroke="#999999" stroke-width="2"/>
  <ellipse cx="55" cy="65" rx="22" ry="12" fill="none" stroke="#999999" stroke-width="2"/>
  <!-- Left leaf -->
  <ellipse cx="75" cy="160" rx="12" ry="25" fill="none" stroke="#999999" stroke-width="2" transform="rotate(-25 75 160)"/>
  <!-- Right leaf -->
  <ellipse cx="125" cy="160" rx="12" ry="25" fill="none" stroke="#999999" stroke-width="2" transform="rotate(25 125 160)"/>
</svg>